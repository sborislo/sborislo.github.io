<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel – Samuel H. Borislow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="site-name" href="index.html">Samuel H. Borislow</a>
    <nav class="site-nav">
      <a href="index.html">About</a>
      <a href="research.html">Research</a>
      <a href="teaching.html">Teaching</a>
      <a href="cv.html">CV</a>
      <a href="travel.html" class="active">Travel</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>Travel</h1>
  <p class="subtitle subtitle-strong">I've had the great fortune to visit a lot of cool places over the years. Here are some photos from my travels.</p>

  <div class="slideshow" id="travel-slideshow">
    <div class="slideshow-viewport">
      <img class="slide-img" id="slide-img" src="" alt="Travel photo">
      <div class="slide-caption" id="slide-caption"></div>
      <button class="slide-arrow prev" id="slide-prev" aria-label="Previous photo">&#8249;</button>
      <button class="slide-arrow next" id="slide-next" aria-label="Next photo">&#8250;</button>
    </div>
    <div class="slide-dots" id="slide-dots"></div>
  </div>

</main>

<footer class="wrap">
  &copy; 2026 &ndash; Samuel H. Borislow
</footer>

<script>
  /* ============================================================
     TRAVEL SLIDESHOW
     Add / remove photos by editing this list. Each entry needs:
       src      – image URL (or a local filename like "photos/kyoto.jpg"
                  if you put image files next to this html page)
       caption  – text shown under the photo (optional, leave "" for none)
     The order here is the order they play in.
     ============================================================ */
  const slides = [
    { src: "photos/shasta.jpg",                          caption: "Mt. Shasta, California" },
    { src: "photos/Nassau_bahamas.jpg",                caption: "Nassau, The Bahamas" },
    { src: "photos/Lamani_belize.jpg",                  caption: "Lamani, Belize" },
    { src: "photos/Sacred_Valley_of_the_Incas_peru.jpg", caption: "Sacred Valley of the Incas, Peru" },
    { src: "photos/west_bay_Honduras.jpg",               caption: "West Bay, Honduras" },
    { src: "photos/sedona_arizona.jpg",                 caption: "Sedona, Arizona" },
    { src: "photos/Piestewa_Peak.jpg",                   caption: "Piestewa Peak, Arizona" },
    { src: "photos/wintergreen.jpg",                     caption: "Wintergreen, Virginia" },
    { src: "photos/umpqua.jpg",                          caption: "Umpqua National Forest, Oregon" },
    { src: "photos/bushkill_falls_PA.jpg",              caption: "Bushkill Falls, Pennsylvania" },
    { src: "photos/Big_Sur_California.jpg",             caption: "Big Sur, California" },
    { src: "photos/banff.jpg",                           caption: "Banff National Park, Canada" },
    { src: "photos/ireland.jpg",                         caption: "Wicklow, Ireland" },
    { src: "photos/provence.jpg",                        caption: "Provence, France" },
    { src: "photos/Siglufjörður.jpg",                    caption: "Siglufjörður, Iceland" },
    { src: "photos/Dettifoss.jpg",                       caption: "Dettifoss, Iceland" },
    { src: "photos/Høyanger.jpg",                        caption: "Høyanger, Norway" },
    { src: "photos/hualien.jpg",                         caption: "Hualien, Taiwan" },
    { src: "photos/kaohsiung.jpg",                       caption: "Kaohsiung, Taiwan" },
    { src: "photos/kelung_city.jpg",                     caption: "Kelung, Taiwan" },
    { src: "photos/taipei.jpg",                          caption: "Taipei, Taiwan" },
    { src: "photos/tokyo.jpg",                           caption: "Tokyo, Japan" },
    { src: "photos/osaka.jpg",                           caption: "Osaka, Japan" },
    { src: "photos/okutama.jpg",                         caption: "Okutama, Japan" },
    { src: "photos/kyoto.jpg",                           caption: "Kyoto, Japan" }
  ];

  let current = 0;
  const imgEl = document.getElementById("slide-img");
  const capEl = document.getElementById("slide-caption");
  const dotsEl = document.getElementById("slide-dots");

  function renderDots(){
    dotsEl.innerHTML = "";
    slides.forEach((_, i) => {
      const dot = document.createElement("button");
      dot.className = "slide-dot" + (i === current ? " active" : "");
      dot.setAttribute("aria-label", "Go to photo " + (i + 1));
      dot.addEventListener("click", () => goTo(i));
      dotsEl.appendChild(dot);
    });
  }

  function goTo(i){
    current = (i + slides.length) % slides.length;
    imgEl.src = slides[current].src;
    imgEl.alt = slides[current].caption || "Travel photo";
    capEl.textContent = slides[current].caption || "";
    capEl.style.display = slides[current].caption ? "block" : "none";
    [...dotsEl.children].forEach((d, idx) => d.classList.toggle("active", idx === current));
  }

  document.getElementById("slide-prev").addEventListener("click", () => goTo(current - 1));
  document.getElementById("slide-next").addEventListener("click", () => goTo(current + 1));

  document.getElementById("travel-slideshow").addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") goTo(current - 1);
    if (e.key === "ArrowRight") goTo(current + 1);
  });

  // Only show arrows/dots if there's more than one photo
  if (slides.length > 1){
    document.getElementById("travel-slideshow").classList.add("multi");
  }

  renderDots();
  goTo(0);
</script>

</body>
</html>
